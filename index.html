<body>

    <button class="valgbtn" id="sten" ><img src="./assets/img/saks.svg" alt="sten">Sten</button>
    <button class="valgbtn" id="saks" ><img src="./assets/img/saks.svg" alt="saks">Saks</button>
    <button class="valgbtn" id="papir"><img src="./assets/img/saks.svg" alt="papir">Papir</button>
    
    <div id="svar">
        <p>Computeren valgte:</p>
        <div id="computerValg"></div>
        <p>Du valgte:</p>
        <div id="computerValg"></div>
        <p>Resultat:</p>
            <div id="resultat"></div>
    </div>
    <div id="resultatBoks">
            <p>Din score vs computeren:</p>
            <div id="score"></div>
    </div>
    <div>
        <button id="nytspil">Nyt spil</button>
    </div>
